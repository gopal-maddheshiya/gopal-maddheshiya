<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Gradient for Title -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <style>
      @keyframes pulse {
        0% { opacity: 1; r: 4.5; }
        50% { opacity: 0.35; r: 6.5; }
        100% { opacity: 1; r: 4.5; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .pulse-dot {
        animation: pulse 2s infinite ease-in-out;
      }
      .cursor-blink {
        animation: blink 1s infinite;
      }
      .terminal-text {
        font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
      }
    </style>
  </defs>

  <!-- Container Box with Border Gradient -->
  <rect x="1.5" y="1.5" width="847" height="237" rx="12" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="1.5" y="1.5" width="847" height="38" rx="12" fill="#0B0F19" />
  <rect x="1.5" y="27" width="847" height="13" fill="#0B0F19" />
  <line x1="1.5" y1="40" x2="848.5" y2="40" stroke="#1E293B" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="20" r="5.5" fill="#EF4444" />
  <circle cx="39" cy="20" r="5.5" fill="#F59E0B" />
  <circle cx="56" cy="20" r="5.5" fill="#10B981" />

  <!-- Terminal Window Title -->
  <text x="78" y="24" fill="#64748B" font-size="12" class="terminal-text" font-weight="500">gopal@workstation: ~/developer-profile (main)</text>

  <!-- Status Pill (Right-aligned) -->
  <g transform="translate(615, 10)">
    <rect x="0" y="0" width="218" height="20" rx="10" fill="#0A1E1E" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.8" />
    <circle cx="14" cy="10" r="4.5" fill="#10B981" class="pulse-dot" />
    <text x="26" y="14" fill="#34D399" font-size="10.5" class="terminal-text" font-weight="600" letter-spacing="0.4">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Command -->
  <text x="24" y="70" fill="#38BDF8" font-size="13" class="terminal-text" font-weight="600">❯ whoami</text>

  <!-- Line 2: Name & Main Title -->
  <text x="24" y="98" fill="url(#nameGradient)" font-size="22" class="terminal-text" font-weight="700" letter-spacing="-0.3">GOPAL MADDHESHIYA</text>
  <text x="315" y="97" fill="#94A3B8" font-size="13.5" class="terminal-text" font-weight="400">/ Full-Stack &amp; Desktop Systems Engineer</text>

  <!-- Line 3: Tech Focus -->
  <text x="24" y="133" fill="#38BDF8" font-size="13" class="terminal-text" font-weight="600">❯ sys.status --stack</text>
  <text x="24" y="157" fill="#E2E8F0" font-size="13" class="terminal-text">
    <tspan fill="#A78BFA" font-weight="600">Architecture:</tspan> MERN Stack <tspan fill="#475569">|</tspan>
    <tspan fill="#A78BFA" font-weight="600"> Core:</tspan> Java &amp; DSA <tspan fill="#475569">|</tspan>
    <tspan fill="#A78BFA" font-weight="600"> Desktop:</tspan> Electron &amp; Node.js <tspan fill="#475569">|</tspan>
    <tspan fill="#A78BFA" font-weight="600"> AI:</tspan> Intelligent APIs
  </text>

  <!-- Line 4: Education & Bio -->
  <text x="24" y="192" fill="#38BDF8" font-size="13" class="terminal-text" font-weight="600">❯ cat education_and_focus.env</text>
  <rect x="270" y="180" width="7" height="15" fill="#00F0FF" class="cursor-blink" />
  <text x="24" y="214" fill="#94A3B8" font-size="12" class="terminal-text">B.Tech Computer Science &amp; Engineering @ SRMU (2024–2028) <tspan fill="#00F0FF">•</tspan> Engineering high-performance software</text>
</svg>
