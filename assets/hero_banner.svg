<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Typography Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Scanline Sweep Animation -->
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulseDot {
        0% { opacity: 1; r: 4.5; }
        50% { opacity: 0.35; r: 7; }
        100% { opacity: 1; r: 4.5; }
      }
      @keyframes sweepScan {
        0% { transform: translateX(-920px); }
        100% { transform: translateX(920px); }
      }
      .pulse-beacon { animation: pulseDot 2s infinite ease-in-out; }
      .scan-beam { animation: sweepScan 4s infinite linear; }
      .mono-font { font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="276" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Cyber Grid Overlay -->
  <rect x="3" y="3" width="914" height="274" rx="13" fill="url(#cyberGrid)" />

  <!-- Header Window Bar -->
  <rect x="2" y="2" width="916" height="42" rx="14" fill="#0A0E1A" fill-opacity="0.9" />
  <rect x="2" y="30" width="916" height="14" fill="#0A0E1A" fill-opacity="0.9" />
  <line x1="2" y1="44" x2="918" y2="44" stroke="#1E293B" stroke-width="1.2" />

  <!-- Window Dots -->
  <circle cx="24" cy="22" r="6" fill="#EF4444" />
  <circle cx="43" cy="22" r="6" fill="#F59E0B" />
  <circle cx="62" cy="22" r="6" fill="#10B981" />

  <!-- Window Title -->
  <text x="88" y="26" fill="#64748B" font-size="12" class="mono-font" font-weight="600">gopal@workstation: ~/developer-portfolio (main)</text>

  <!-- Status Beacon Badge (Top Right) -->
  <g transform="translate(685, 11)">
    <rect x="0" y="0" width="215" height="22" rx="11" fill="#051E1C" stroke="#10B981" stroke-width="1" />
    <circle cx="14" cy="11" r="4.5" fill="#10B981" class="pulse-beacon" />
    <text x="26" y="15.5" fill="#34D399" font-size="10.5" class="mono-font" font-weight="700" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Ambient Glow Behind Name -->
  <circle cx="280" cy="130" r="140" fill="#00F0FF" fill-opacity="0.08" filter="blur(40px)" />
  <circle cx="620" cy="150" r="140" fill="#8B5CF6" fill-opacity="0.08" filter="blur(40px)" />

  <!-- Main Identity Content -->
  <!-- Developer Tag -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="168" height="22" rx="4" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="0.8" />
    <text x="10" y="15" fill="#38BDF8" font-size="11" class="mono-font" font-weight="700">⚡ SOFTWARE ENGINEER</text>
  </g>

  <!-- Big Name with Radiant Glow -->
  <text x="32" y="142" fill="url(#textGrad)" font-size="40" class="sans-font" font-weight="900" letter-spacing="-1px" filter="url(#neonGlow)">GOPAL MADDHESHIYA</text>

  <!-- Subtitle Tagline -->
  <text x="34" y="174" fill="url(#subGrad)" font-size="16" class="mono-font" font-weight="600" letter-spacing="0.3">
    Full-Stack Systems Architect &amp; Desktop Software Engineer
  </text>

  <!-- Core Pillars Matrix (Pill Badges) -->
  <g transform="translate(34, 198)">
    <!-- Pill 1: MERN -->
    <rect x="0" y="0" width="138" height="28" rx="6" fill="#0F172A" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.7" />
    <text x="14" y="18" fill="#E2E8F0" font-size="12" class="mono-font" font-weight="600">◈ MERN Stack</text>

    <!-- Pill 2: Java & DSA -->
    <rect x="150" y="0" width="158" height="28" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.7" />
    <text x="164" y="18" fill="#E2E8F0" font-size="12" class="mono-font" font-weight="600">☕ Java &amp; Algorithms</text>

    <!-- Pill 3: Desktop -->
    <rect x="320" y="0" width="155" height="28" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.7" />
    <text x="334" y="18" fill="#E2E8F0" font-size="12" class="mono-font" font-weight="600">💻 Electron Desktop</text>

    <!-- Pill 4: SIH 2026 -->
    <rect x="487" y="0" width="155" height="28" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.7" />
    <text x="501" y="18" fill="#E2E8F0" font-size="12" class="mono-font" font-weight="600">🌾 SIH 2026 Agritech</text>

    <!-- Pill 5: Academics -->
    <rect x="654" y="0" width="198" height="28" rx="6" fill="#0F172A" stroke="#EC4899" stroke-width="1" stroke-opacity="0.7" />
    <text x="668" y="18" fill="#E2E8F0" font-size="12" class="mono-font" font-weight="600">🎓 B.Tech CSE @ SRMU</text>
  </g>

  <!-- Bottom Animated Scanline Beam -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="2" y="260" width="916" height="16" rx="8" />
    </clipPath>
    <line x1="2" y1="274" x2="918" y2="274" stroke="#1E293B" stroke-width="1.5" />
    <line x1="0" y1="274" x2="300" y2="274" stroke="url(#scanlineGrad)" stroke-width="3" class="scan-beam" />
  </g>
</svg>

