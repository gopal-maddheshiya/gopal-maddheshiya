<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="auto">
  <defs>
    <!-- Background & Editor Theme -->
    <linearGradient id="editorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Powerline Gradients -->
    <linearGradient id="powerlineNormal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="nameGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <style>
      @keyframes pulseBeacon {
        0% { opacity: 1; r: 4.5; }
        50% { opacity: 0.35; r: 6.5; }
        100% { opacity: 1; r: 4.5; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .beacon { animation: pulseBeacon 2.2s infinite ease-in-out; }
      .term-cursor { animation: cursorBlink 1.1s infinite; }
      .code-font {
        font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="1.5" y="1.5" width="897" height="337" rx="10" fill="url(#editorBg)" stroke="url(#windowBorder)" stroke-width="1.5" />

  <!-- Top Window Header Bar -->
  <path d="M 1.5,11.5 Q 1.5,1.5 11.5,1.5 L 888.5,1.5 Q 898.5,1.5 898.5,11.5 L 898.5,38 L 1.5,38 Z" fill="#080C14" />
  <line x1="1.5" y1="38" x2="898.5" y2="38" stroke="#1E293B" stroke-width="1" />

  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="22" cy="19.5" r="5.5" fill="#EF4444" />
  <circle cx="39" cy="19.5" r="5.5" fill="#F59E0B" />
  <circle cx="56" cy="19.5" r="5.5" fill="#10B981" />

  <!-- Editor Tabs -->
  <!-- Tab 1: Active (engineer.ts) -->
  <path d="M 85,38 L 85,12 Q 85,8 90,8 L 225,8 Q 230,8 230,12 L 230,38 Z" fill="#0D111A" stroke="#1E293B" stroke-width="1" />
  <line x1="85" y1="8" x2="230" y2="8" stroke="#00F0FF" stroke-width="2" />
  <text x="96" y="24" fill="#38BDF8" font-size="12" class="code-font" font-weight="600"> engineer.ts</text>
  <text x="210" y="24" fill="#64748B" font-size="11" class="code-font">×</text>

  <!-- Tab 2: Inactive (Solution.java) -->
  <text x="246" y="24" fill="#64748B" font-size="12" class="code-font"> Solution.java</text>

  <!-- Tab 3: Inactive (projects.md) -->
  <text x="375" y="24" fill="#64748B" font-size="12" class="code-font">󰈚 projects.md</text>

  <!-- Tab 4: Inactive (term: zsh) -->
  <text x="495" y="24" fill="#64748B" font-size="12" class="code-font">󰆍 term: zsh</text>

  <!-- Status Pill (Top Right) -->
  <g transform="translate(685, 9)">
    <rect x="0" y="0" width="195" height="20" rx="10" fill="#061A1A" stroke="#10B981" stroke-width="0.8" />
    <circle cx="12" cy="10" r="4.5" fill="#10B981" class="beacon" />
    <text x="24" y="14" fill="#34D399" font-size="10.5" class="code-font" font-weight="600" letter-spacing="0.4">AVAILABLE FOR INTERNSHIPS</text>
  </g>

  <!-- Breadcrumbs Bar -->
  <rect x="1.5" y="38" width="897" height="24" fill="#090D15" />
  <line x1="1.5" y1="62" x2="898.5" y2="62" stroke="#1E293B" stroke-width="0.8" />
  <text x="20" y="54" fill="#64748B" font-size="11" class="code-font">
    <tspan fill="#38BDF8">workspace</tspan> &gt; <tspan fill="#8B5CF6">src</tspan> &gt; <tspan fill="#94A3B8">engineers</tspan> &gt; <tspan fill="#E2E8F0">gopal_maddheshiya.ts</tspan>
  </text>

  <!-- Editor Code Body -->
  <!-- Line Numbers & Code Lines -->
  <!-- Line 01 -->
  <text x="20" y="88" fill="#475569" font-size="12.5" class="code-font">01</text>
  <text x="52" y="88" fill="#F43F5E" font-size="13" class="code-font" font-weight="600">const</text>
  <text x="96" y="88" fill="#E2E8F0" font-size="13" class="code-font">engineer</text>
  <text x="165" y="88" fill="#38BDF8" font-size="13" class="code-font">: SoftwareEngineer = {</text>

  <!-- Line 02: Name -->
  <text x="20" y="112" fill="#475569" font-size="12.5" class="code-font">02</text>
  <text x="68" y="112" fill="#94A3B8" font-size="13" class="code-font">name:</text>
  <text x="115" y="112" fill="url(#nameGlow)" font-size="14.5" class="code-font" font-weight="700">"Gopal Maddheshiya"</text>
  <text x="300" y="112" fill="#64748B" font-size="12" class="code-font">, // Full-Stack &amp; Desktop Systems Builder</text>

  <!-- Line 03: Academics -->
  <text x="20" y="136" fill="#475569" font-size="12.5" class="code-font">03</text>
  <text x="68" y="136" fill="#94A3B8" font-size="13" class="code-font">academics:</text>
  <text x="150" y="136" fill="#FBBF24" font-size="13" class="code-font">"B.Tech Computer Science &amp; Engineering @ SRMU (2024-2028)"</text>
  <text x="655" y="136" fill="#64748B" font-size="13" class="code-font">,</text>

  <!-- Line 04: Focus -->
  <text x="20" y="160" fill="#475569" font-size="12.5" class="code-font">04</text>
  <text x="68" y="160" fill="#94A3B8" font-size="13" class="code-font">core_stack:</text>
  <text x="158" y="160" fill="#38BDF8" font-size="13" class="code-font">[</text>
  <text x="168" y="160" fill="#34D399" font-size="13" class="code-font">"MERN Architecture"</text>
  <text x="328" y="160" fill="#64748B" font-size="13" class="code-font">, </text>
  <text x="340" y="160" fill="#34D399" font-size="13" class="code-font">"Java &amp; Algorithms"</text>
  <text x="500" y="160" fill="#64748B" font-size="13" class="code-font">, </text>
  <text x="512" y="160" fill="#34D399" font-size="13" class="code-font">"Desktop (Electron)"</text>
  <text x="672" y="160" fill="#64748B" font-size="13" class="code-font">, </text>
  <text x="684" y="160" fill="#34D399" font-size="13" class="code-font">"AI Workflows"</text>
  <text x="800" y="160" fill="#38BDF8" font-size="13" class="code-font">],</text>

  <!-- Line 05: Projects -->
  <text x="20" y="184" fill="#475569" font-size="12.5" class="code-font">05</text>
  <text x="68" y="184" fill="#94A3B8" font-size="13" class="code-font">flagship_builds:</text>
  <text x="200" y="184" fill="#E2E8F0" font-size="13" class="code-font">{</text>
  <text x="215" y="184" fill="#C084FC" font-size="13" class="code-font">browser:</text>
  <text x="282" y="184" fill="#FBBF24" font-size="13" class="code-font">"Avap Browser"</text>
  <text x="390" y="184" fill="#64748B" font-size="13" class="code-font">, </text>
  <text x="402" y="184" fill="#C084FC" font-size="13" class="code-font">hackathon:</text>
  <text x="488" y="184" fill="#FBBF24" font-size="13" class="code-font">"Krishi Suraksha (SIH 2026)"</text>
  <text x="735" y="184" fill="#E2E8F0" font-size="13" class="code-font"> },</text>

  <!-- Line 06: Philosophy -->
  <text x="20" y="208" fill="#475569" font-size="12.5" class="code-font">06</text>
  <text x="68" y="208" fill="#94A3B8" font-size="13" class="code-font">philosophy:</text>
  <text x="165" y="208" fill="#FBBF24" font-size="13" class="code-font">"Engineering low-latency APIs, clean abstractions, and high throughput"</text>
  <text x="778" y="208" fill="#64748B" font-size="13" class="code-font">,</text>

  <!-- Line 07: Status -->
  <text x="20" y="232" fill="#475569" font-size="12.5" class="code-font">07</text>
  <text x="68" y="232" fill="#94A3B8" font-size="13" class="code-font">objective:</text>
  <text x="155" y="232" fill="#34D399" font-size="13" class="code-font">"Actively seeking Software Engineering &amp; Full-Stack Internships"</text>

  <!-- Line 08: End -->
  <text x="20" y="256" fill="#475569" font-size="12.5" class="code-font">08</text>
  <text x="52" y="256" fill="#E2E8F0" font-size="13" class="code-font">};</text>
  <rect x="75" y="244" width="7.5" height="15" fill="#00F0FF" class="term-cursor" />

  <!-- Neovim Statusline (Powerline Bar) -->
  <g transform="translate(1.5, 305)">
    <!-- Base Bar -->
    <rect x="0" y="0" width="897" height="32" fill="#090D16" />
    <line x1="0" y1="0" x2="897" y2="0" stroke="#1E293B" stroke-width="1" />

    <!-- Section 1: Mode (NORMAL) in Cyan -->
    <rect x="0" y="0" width="95" height="32" fill="url(#powerlineNormal)" />
    <!-- Arrow 1 -->
    <polygon points="95,0 110,16 95,32" fill="url(#powerlineNormal)" />
    <text x="14" y="20" fill="#080C14" font-size="12" class="code-font" font-weight="800">NORMAL</text>

    <!-- Section 2: Git Branch (main) -->
    <rect x="110" y="0" width="105" height="32" fill="#1E293B" />
    <polygon points="215,0 230,16 215,32" fill="#1E293B" />
    <text x="125" y="20" fill="#38BDF8" font-size="11.5" class="code-font" font-weight="600"> main</text>

    <!-- Section 3: File info -->
    <text x="245" y="20" fill="#94A3B8" font-size="11.5" class="code-font">gopal_maddheshiya.ts</text>
    <text x="410" y="20" fill="#475569" font-size="11.5" class="code-font">|</text>
    <text x="425" y="20" fill="#64748B" font-size="11.5" class="code-font">utf-8</text>
    <text x="475" y="20" fill="#475569" font-size="11.5" class="code-font">|</text>
    <text x="490" y="20" fill="#38BDF8" font-size="11.5" class="code-font">typescript</text>

    <!-- Right Side: Diagnostics & Academic Track -->
    <!-- Arrow Right 1 -->
    <polygon points="695,0 710,16 695,32" fill="#1E293B" />
    <rect x="710" y="0" width="187" height="32" fill="#1E293B" />
    <text x="725" y="20" fill="#A78BFA" font-size="11.5" class="code-font" font-weight="600">SRMU CSE (2024–28)</text>
    <text x="860" y="20" fill="#10B981" font-size="12" class="code-font">100%</text>
  </g>
</svg>

